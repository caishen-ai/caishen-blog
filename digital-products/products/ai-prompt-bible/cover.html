<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:800px; height:600px; overflow:hidden;
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(135deg, #0c0c1d 0%, #1a1040 30%, #0d1b2a 60%, #1b0a2e 100%);
  display:flex; align-items:center; justify-content:center;
}
.card {
  width:720px; height:520px;
  background: linear-gradient(145deg, rgba(20,20,50,0.9), rgba(10,10,30,0.95));
  border-radius:24px;
  border: 1px solid rgba(120,80,255,0.15);
  box-shadow: 0 30px 80px rgba(80,40,180,0.3), 0 0 200px rgba(100,60,255,0.1);
  display:flex; flex-direction:column;
  padding:50px 60px;
  position:relative;
  overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:-80px; right:-80px;
  width:300px; height:300px;
  background: radial-gradient(circle, rgba(140,100,255,0.25) 0%, transparent 70%);
  border-radius:50%;
}
.card::after {
  content:''; position:absolute; bottom:-60px; left:-40px;
  width:220px; height:220px;
  background: radial-gradient(circle, rgba(80,180,255,0.2) 0%, transparent 70%);
  border-radius:50%;
}
.badge {
  align-self: flex-start;
  background: linear-gradient(135deg, #7c3aed, #6366f1);
  color:#fff; font-size:13px; font-weight:700;
  padding:6px 18px; border-radius:20px;
  letter-spacing:1px; z-index:1;
  margin-bottom:30px;
}
h1 {
  font-size:48px; font-weight:800; color:#f0e6ff;
  line-height:1.2; z-index:1;
  text-shadow: 0 0 40px rgba(140,100,255,0.4);
  margin-bottom:12px;
}
h1 span { color:#a78bfa; }
.subtitle {
  font-size:20px; color:#b4a5d6; font-weight:400;
  margin-bottom:30px; z-index:1;
}
.features {
  display:flex; gap:16px; z-index:1; margin-bottom:35px;
  flex-wrap:wrap;
}
.feat {
  background: rgba(120,80,220,0.12);
  padding:8px 16px; border-radius:10px;
  font-size:14px; color:#c4b5e4;
  border:1px solid rgba(140,100,255,0.15);
}
.stats {
  display:flex; gap:32px; z-index:1; margin-bottom:auto;
}
.stat { display:flex; flex-direction:column; }
.stat-num { font-size:32px; font-weight:800; color:#fff; }
.stat-label { font-size:13px; color:#8b7cb5; margin-top:2px; }
.footer {
  display:flex; justify-content:space-between; align-items:center;
  z-index:1; border-top:1px solid rgba(120,80,255,0.12);
  padding-top:20px;
}
.author { font-size:14px; color:#8b7cb5; }
.version { font-size:13px; color:#6b5c95; }
.glow-dot {
  width:10px; height:10px; background:#a78bfa;
  border-radius:50%; box-shadow:0 0 20px #a78bfa,0 0 40px #7c3aed;
  display:inline-block; margin-right:6px;
}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🔮 2026 最新版</div>
  <h1>AI Prompt<br><span>宝典</span></h1>
  <div class="subtitle">200+ 专业提示词，让你的AI效率提升 10 倍</div>
  <div class="features">
    <span class="feat">📝 内容创作</span>
    <span class="feat">📊 商业决策</span>
    <span class="feat">💻 编程开发</span>
    <span class="feat">📱 自媒体运营</span>
    <span class="feat">🛒 电商运营</span>
    <span class="feat">🎓 学习教育</span>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-num">200+</span><span class="stat-label">实战提示词</span></div>
    <div class="stat"><span class="stat-num">10</span><span class="stat-label">大场景分类</span></div>
    <div class="stat"><span class="stat-num">即用</span><span class="stat-label">复制即用</span></div>
  </div>
  <div class="footer">
    <span class="author"><span class="glow-dot"></span>财神出品</span>
    <span class="version">v2.0 · 完整版</span>
  </div>
</div>
</body>
</html>
