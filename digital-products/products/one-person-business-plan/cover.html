<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:800px; height:600px; overflow:hidden;
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(145deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
  display:flex; align-items:center; justify-content:center;
}
.card {
  width:720px; height:520px;
  background: linear-gradient(150deg, rgba(22,25,45,0.93), rgba(15,20,40,0.95));
  border-radius:24px;
  border: 1px solid rgba(255,165,0,0.12);
  box-shadow: 0 30px 80px rgba(255,140,0,0.2), 0 0 180px rgba(255,160,0,0.06);
  display:flex; flex-direction:column;
  padding:50px 60px;
  position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:-60px; left:50%;
  width:280px; height:280px;
  background: radial-gradient(circle, rgba(255,165,0,0.13) 0%, transparent 70%);
  border-radius:50%;
}
.card::after {
  content:''; position:absolute; bottom:-40px; right:-40px;
  width:180px; height:180px;
  background: radial-gradient(circle, rgba(255,120,0,0.1) 0%, transparent 70%);
  border-radius:50%;
}
.badge {
  align-self: flex-start;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color:#fff; font-size:13px; font-weight:700;
  padding:6px 18px; border-radius:20px;
  letter-spacing:1px; z-index:1; margin-bottom:30px;
}
h1 {
  font-size:46px; font-weight:800; color:#fef3c7;
  line-height:1.2; z-index:1;
  margin-bottom:10px;
}
h1 span { color:#f59e0b; }
.subtitle {
  font-size:19px; color:#fcd34d; font-weight:400;
  margin-bottom:28px; z-index:1;
}
.features {
  display:flex; gap:12px; z-index:1; margin-bottom:25px; flex-wrap:wrap;
}
.feat {
  background: rgba(245,158,11,0.08);
  padding:7px 14px; border-radius:8px;
  font-size:13px; color:#fcd34d;
  border:1px solid rgba(245,158,11,0.1);
}
.highlights {
  z-index:1; margin-bottom:28px;
  display:flex; gap:24px;
}
.hi-item {
  display:flex; align-items:center; gap:8px;
  color:#d4b97c; font-size:15px;
}
.hi-icon { font-size:22px; }
.stats {
  display:flex; gap:30px; z-index:1; margin-bottom:auto;
}
.stat { display:flex; flex-direction:column; }
.stat-num { font-size:30px; font-weight:800; color:#fff; }
.stat-label { font-size:12px; color:#a88b5c; margin-top:2px; }
.bottom {
  display:flex; justify-content:space-between; align-items:center;
  z-index:1; border-top:1px solid rgba(245,158,11,0.1);
  padding-top:20px;
}
.author { font-size:14px; color:#a88b5c; }
.version { font-size:13px; color:#887b5c; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">🚀 超级个体必备</div>
  <h1>一人公司<br><span>商业计划书</span></h1>
  <div class="subtitle">Notion × AI 全功能商业计划模板</div>
  <div class="features">
    <span class="feat">🎯 商业模式画布</span>
    <span class="feat">📊 收入模型计算器</span>
    <span class="feat">🗓️ 90天行动路线图</span>
    <span class="feat">💰 启动预算模板</span>
    <span class="feat">📈 关键指标仪表盘</span>
  </div>
  <div class="highlights">
    <div class="hi-item"><span class="hi-icon">✅</span> 填写即用</div>
    <div class="hi-item"><span class="hi-icon">🔄</span> 支持Notion导入</div>
    <div class="hi-item"><span class="hi-icon">📝</span> 每周复盘模板</div>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-num">4</span><span class="stat-label">核心模块</span></div>
    <div class="stat"><span class="stat-num">90天</span><span class="stat-label">执行路线图</span></div>
    <div class="stat"><span class="stat-num">即用</span><span class="stat-label">拿来即用</span></div>
  </div>
  <div class="bottom">
    <span class="author">🧩 财神出品</span>
    <span class="version">v2.0 · 完整版</span>
  </div>
</div>
</body>
</html>
