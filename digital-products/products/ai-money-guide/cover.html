<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  width:800px; height:600px; overflow:hidden;
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(160deg, #0a1628 0%, #08200a 35%, #1a2800 65%, #0a1628 100%);
  display:flex; align-items:center; justify-content:center;
}
.card {
  width:720px; height:520px;
  background: linear-gradient(160deg, rgba(8,20,40,0.92), rgba(5,15,5,0.92));
  border-radius:24px;
  border: 1px solid rgba(0,200,100,0.15);
  box-shadow: 0 30px 80px rgba(0,160,60,0.25), 0 0 180px rgba(0,200,80,0.08);
  display:flex; flex-direction:column;
  padding:50px 60px;
  position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:-50px; right:-60px;
  width:250px; height:250px;
  background: radial-gradient(circle, rgba(0,210,100,0.18) 0%, transparent 70%);
  border-radius:50%;
}
.card::after {
  content:''; position:absolute; bottom:-80px; left:30%;
  width:200px; height:200px;
  background: radial-gradient(circle, rgba(255,200,0,0.12) 0%, transparent 70%);
  border-radius:50%;
}
.badge {
  align-self: flex-start;
  background: linear-gradient(135deg, #059669, #10b981);
  color:#fff; font-size:13px; font-weight:700;
  padding:6px 18px; border-radius:20px;
  letter-spacing:1px; z-index:1; margin-bottom:30px;
}
h1 {
  font-size:46px; font-weight:800; color:#ecfdf5;
  line-height:1.2; z-index:1;
  margin-bottom:10px;
}
h1 span { color:#10b981; }
.subtitle {
  font-size:20px; color:#6ee7b7; font-weight:400;
  margin-bottom:24px; z-index:1;
}
.tagline {
  font-size:15px; color:#a7f3d0; margin-bottom:30px; z-index:1;
  letter-spacing:2px; font-weight:500;
}
.features {
  display:flex; gap:12px; z-index:1; margin-bottom:28px; flex-wrap:wrap;
}
.feat {
  background: rgba(0,180,80,0.1);
  padding:7px 14px; border-radius:8px;
  font-size:13px; color:#6ee7b7;
  border:1px solid rgba(0,180,80,0.12);
}
.stats {
  display:flex; gap:28px; z-index:1; margin-bottom:auto;
}
.stat { display:flex; flex-direction:column; }
.stat-num { font-size:30px; font-weight:800; color:#fff; }
.stat-label { font-size:12px; color:#6b9b7c; margin-top:2px; }
.bottom {
  display:flex; justify-content:space-between; align-items:center;
  z-index:1; border-top:1px solid rgba(0,160,80,0.12);
  padding-top:20px;
}
.author { font-size:14px; color:#6b9b7c; }
.version { font-size:13px; color:#4b7b5c; }
.emoji-big { font-size:36px; margin-right:8px; vertical-align:middle; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">💰 2026 最新实战指南</div>
  <h1><span>AI赚钱</span><br>完全指南</h1>
  <div class="subtitle">零基础 · 零成本 · 一个人也能月入过万</div>
  <div class="tagline">从 0 到 1 的 AI 创富实战手册</div>
  <div class="features">
    <span class="feat">🎯 10 大变现路径</span>
    <span class="feat">📦 数字产品从0到1</span>
    <span class="feat">🤖 AI自动化服务</span>
    <span class="feat">📱 短视频与社交媒体</span>
    <span class="feat">🛒 跨境电商攻略</span>
    <span class="feat">🗺️ 90天行动计划</span>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-num">10</span><span class="stat-label">完整章节</span></div>
    <div class="stat"><span class="stat-num">实战</span><span class="stat-label">真实案例驱动</span></div>
    <div class="stat"><span class="stat-num">90天</span><span class="stat-label">行动路线图</span></div>
  </div>
  <div class="bottom">
    <span class="author">🔥 财神出品</span>
    <span class="version">v2.0 · 完整版</span>
  </div>
</div>
</body>
</html>
