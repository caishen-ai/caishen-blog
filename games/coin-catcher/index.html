<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接金币 · 休闲小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:Arial;touch-action:none}
canvas{background:linear-gradient(180deg,#0f3460,#16213e);border-radius:12px}
#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#e94560;font-size:20px;font-weight:bold;z-index:10}
</style>
</head>
<body>
<div id="ui">💰 <span id="score">0</span></div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

// 响应式大小
const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
canvas.width = size;
canvas.height = size * 1.3;

let score = 0, lives = 3, gameOver = false;
let player = { x: canvas.width/2, y: canvas.height-100, w: 80, h: 20 };
let coins = [];
let bombs = [];
let frame = 0;
let speed = 2;

// 触摸/鼠标控制
let targetX = player.x;
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    targetX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    targetX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
});
canvas.addEventListener('mousemove', e => {
    targetX = e.clientX - canvas.getBoundingClientRect().left;
});

function spawnCoin() {
    if (Math.random() < 0.03 + frame * 0.0002) {
        coins.push({
            x: Math.random() * (canvas.width - 30) + 15,
            y: -30,
            r: 15,
            value: Math.random() < 0.1 ? 5 : 1
        });
    }
}

function spawnBomb() {
    if (Math.random() < 0.005 + frame * 0.00005) {
        bombs.push({
            x: Math.random() * (canvas.width - 24) + 12,
            y: -30,
            r: 12
        });
    }
}

function update() {
    if (gameOver) return;
    frame++;
    speed = 2 + frame * 0.001;
    
    // 平滑移动
    player.x += (targetX - player.x) * 0.15;
    player.x = Math.max(player.w/2, Math.min(canvas.width-player.w/2, player.x));
    
    spawnCoin();
    spawnBomb();
    
    // 金币下落
    for (let i = coins.length-1; i >= 0; i--) {
        coins[i].y += speed;
        if (coins[i].y > canvas.height + 30) { coins.splice(i,1); continue }
        // 碰撞检测
        if (Math.abs(coins[i].x - player.x) < player.w/2 + coins[i].r &&
            Math.abs(coins[i].y - player.y) < 20) {
            score += coins[i].value;
            scoreEl.textContent = score;
            coins.splice(i,1);
        }
    }
    
    // 炸弹下落
    for (let i = bombs.length-1; i >= 0; i--) {
        bombs[i].y += speed * 1.1;
        if (bombs[i].y > canvas.height + 30) { bombs.splice(i,1); continue }
        if (Math.abs(bombs[i].x - player.x) < player.w/2 + bombs[i].r &&
            Math.abs(bombs[i].y - player.y) < 20) {
            lives--;
            bombs.splice(i,1);
            if (lives <= 0) gameOver = true;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 玩家
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.roundRect(player.x-player.w/2, player.y-player.h/2, player.w, player.h, 10);
    ctx.fill();
    ctx.fillStyle = '#ff6b81';
    ctx.fillRect(player.x-25, player.y-5, 50, 8);
    
    // 金币
    for (let c of coins) {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ffed4a';
        ctx.beginPath();
        ctx.arc(c.x-3, c.y-3, c.r*0.4, 0, Math.PI*2);
        ctx.fill();
        // 数字
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText((c.value > 1 ? '⭐' : '💰'), c.x, c.y+6);
    }
    
    // 炸弹
    for (let b of bombs) {
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('💣', b.x, b.y+5);
    }
    
    // 生命
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('❤️'.repeat(Math.max(0,lives)), 10, 25);
    
    // 游戏结束
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', canvas.width/2, canvas.height/2-30);
        ctx.font = '20px Arial';
        ctx.fillText('得分: ' + score, canvas.width/2, canvas.height/2+20);
        ctx.fillText('点击重新开始', canvas.width/2, canvas.height/2+60);
    }
}

// 点击重新开始
canvas.addEventListener('click', () => {
    if (gameOver) {
        score = 0; lives = 3; gameOver = false; frame = 0;
        coins = []; bombs = [];
        scoreEl.textContent = '0';
        targetX = canvas.width/2;
    }
});

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
