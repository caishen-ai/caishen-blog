<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI客服免费咨询 — 财神AI</title>
<meta name="description" content="告诉我你的行业和需求，我们帮你定制AI客服方案。免费咨询，24小时内回复。">
<meta property="og:title" content="AI客服免费咨询 — 财神AI">
<meta property="og:description" content="免费咨询AI客服方案，餐饮/电商/零售/教育行业专属定制">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #fef6e4 0%, #f3d2c1 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.container { background:#fff; border-radius:20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width:520px; width:100%; padding:40px 32px; }
h1 { font-size:28px; color:#e63946; margin-bottom:8px; }
.subtitle { color:#6c757d; font-size:15px; margin-bottom:28px; line-height:1.6; }
.form-group { margin-bottom:20px; }
label { display:block; font-weight:600; color:#2b2d42; margin-bottom:6px; font-size:14px; }
label .required { color:#e63946; }
input, select, textarea { width:100%; padding:12px 16px; border:2px solid #e9ecef; border-radius:10px; font-size:15px; transition:border-color 0.2s; font-family:inherit; }
input:focus, select:focus, textarea:focus { outline:none; border-color:#e63946; }
textarea { min-height:100px; resize:vertical; }
.btn { background:#e63946; color:#fff; border:none; border-radius:10px; padding:14px 32px; font-size:16px; font-weight:700; cursor:pointer; width:100%; transition:background 0.2s, transform 0.1s; }
.btn:hover { background:#c1121f; }
.btn:active { transform:scale(0.98); }
.footer-note { margin-top:20px; text-align:center; color:#6c757d; font-size:13px; }
.footer-note a { color:#e63946; text-decoration:none; }
.alt-contact { margin-top:16px; padding:16px; background:#f8f9fa; border-radius:10px; text-align:center; font-size:14px; color:#495057; }
.alt-contact strong { color:#e63946; }
.success-msg { display:none; background:#d4edda; color:#155724; padding:20px; border-radius:10px; margin-bottom:20px; font-size:14px; line-height:1.8; }
.success-msg .summary { margin-top:12px; padding:12px; background:#fff; border-radius:8px; border:1px solid #c3e6cb; font-size:13px; color:#333; text-align:left; }
.success-msg .summary span { font-weight:600; color:#e63946; }
.copy-btn { display:inline-block; margin-top:10px; background:#2b2d42; color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:13px; cursor:pointer; transition:background 0.2s; }
.copy-btn:hover { background:#1a1b2e; }
.copy-btn.copied { background:#28a745; }
@media(max-width:480px) { .container { padding:24px 20px; } h1 { font-size:24px; } }
</style>
</head>
<body>
<div class="container">
  <h1>🤖 AI客服免费咨询</h1>
  <p class="subtitle">告诉我你的行业和需求，我们帮你定制AI客服方案。<br>免费咨询，24小时内回复。</p>

  <div class="success-msg" id="successMsg">
    ✅ <strong>提交成功！</strong>我们会在24小时内联系你。<br>
    <button class="copy-btn" id="copyBtn" onclick="copySummary()">📋 复制提交摘要</button>
    <div class="summary" id="summaryBox"></div>
  </div>

  <form id="contactForm">
    <div class="form-group">
      <label>姓名 <span class="required">*</span></label>
      <input type="text" name="name" id="name" placeholder="怎么称呼你？" required>
    </div>

    <div class="form-group">
      <label>微信号 / 手机号 <span class="required">*</span></label>
      <input type="text" name="contact" id="contact" placeholder="方便我们联系你" required>
    </div>

    <div class="form-group">
      <label>行业类型 <span class="required">*</span></label>
      <select name="industry" id="industry" required>
        <option value="">请选择行业</option>
        <option value="餐饮">餐饮</option>
        <option value="电商">电商</option>
        <option value="零售">零售</option>
        <option value="教育">教育</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="form-group">
      <label>需求描述 <span class="required">*</span></label>
      <textarea name="message" id="message" placeholder="请描述你的业务场景、规模、期望解决的问题" required></textarea>
    </div>

    <div class="form-group">
      <label>预算范围</label>
      <select name="budget" id="budget">
        <option value="">请选择（可选）</option>
        <option value="0-1000元">0-1000元</option>
        <option value="1000-5000元">1000-5000元</option>
        <option value="5000元以上">5000元以上</option>
      </select>
    </div>

    <button type="submit" class="btn">📩 提交咨询</button>
  </form>

  <div class="alt-contact">
    或直接联系：📧 <strong>729616934@qq.com</strong> · 🤖 <a href="https://www.coze.cn/s/ibot?bot_id=7643023913135685675" target="_blank">扣子AI客服Bot</a> · 🐟 闲鱼搜"AI智能客服搭建"
  </div>

  <p class="footer-note">
    提交即表示同意我们通过你提供的方式联系你。
  </p>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var name = document.getElementById('name').value.trim();
  var contact = document.getElementById('contact').value.trim();
  var industry = document.getElementById('industry').value;
  var message = document.getElementById('message').value.trim();
  var budget = document.getElementById('budget').value || '未选择';
  var timestamp = new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});

  // 构建摘要
  var summaryHTML = '<p><span>提交时间：</span>' + timestamp + '</p>';
  summaryHTML += '<p><span>姓名：</span>' + escapeHtml(name) + '</p>';
  summaryHTML += '<p><span>联系方式：</span>' + escapeHtml(contact) + '</p>';
  summaryHTML += '<p><span>行业：</span>' + escapeHtml(industry) + '</p>';
  summaryHTML += '<p><span>预算：</span>' + escapeHtml(budget) + '</p>';
  summaryHTML += '<p><span>需求：</span>' + escapeHtml(message) + '</p>';

  document.getElementById('summaryBox').innerHTML = summaryHTML;

  // 构建纯文本摘要（用于复制）
  var plainSummary = '【AI客服咨询提交】\n';
  plainSummary += '提交时间：' + timestamp + '\n';
  plainSummary += '姓名：' + name + '\n';
  plainSummary += '联系方式：' + contact + '\n';
  plainSummary += '行业：' + industry + '\n';
  plainSummary += '预算：' + budget + '\n';
  plainSummary += '需求：' + message + '\n';
  plainSummary += '---\n来自财神AI客服咨询表单 caishen-ai.github.io/caishen-blog/contact.html';

  // 存储到localStorage
  var submissions = JSON.parse(localStorage.getItem('caishen_submissions') || '[]');
  submissions.push({
    timestamp: timestamp,
    name: name,
    contact: contact,
    industry: industry,
    budget: budget,
    message: message
  });
  localStorage.setItem('caishen_submissions', JSON.stringify(submissions));

  // 存储纯文本摘要用于复制
  window._plainSummary = plainSummary;

  // 构建mailto链接（后备方案）
  var subject = 'AI客服咨询 - ' + industry + '行业 - ' + name;
  var body = plainSummary;
  var mailtoLink = 'mailto:729616934@qq.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

  // 显示成功提示
  document.getElementById('successMsg').style.display = 'block';
  document.getElementById('contactForm').style.display = 'none';

  // 发送到飞书群机器人webhook（请先在飞书群中添加自定义机器人获取webhook URL）
  var FEISHU_WEBHOOK = 'https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_WITH_YOUR_WEBHOOK';
  if (FEISHU_WEBHOOK.indexOf('REPLACE') === -1) {
    fetch(FEISHU_WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        msg_type: 'text',
        content: {text: plainSummary}
      })
    }).catch(function(){});
  }

  // 打开邮件客户端（备选通道）
  setTimeout(function() {
    window.location.href = mailtoLink;
  }, 800);
});

function copySummary() {
  if (window._plainSummary) {
    navigator.clipboard.writeText(window._plainSummary).then(function() {
      var btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 已复制！';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = '📋 复制提交摘要';
        btn.classList.remove('copied');
      }, 2000);
    }).catch(function() {
      alert('复制失败，请手动截图保存');
    });
  }
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}
</script>
</body>
</html>
